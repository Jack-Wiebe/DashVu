name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ci-dummy-secret
  GOOGLE_CLIENT_ID: ci-dummy-google-id
  GOOGLE_CLIENT_SECRET: ci-dummy-google-secret
  SPOTIFY_CLIENT_ID: ci-dummy-spotify-id
  SPOTIFY_CLIENT_SECRET: ci-dummy-spotify-secret

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
